<title id="title">Commons level 1: proposed circulation and zoning</title>
<desc id="desc">Concept-based plan proposal at floor Z57m, radius75.92m. Central closed core and existing lift retained. Open civic plaza, curved arcade groups, gardens and low outer promenade are proposed. Solid teal rectangle marks only the current small prototype courtyard, not an agreed future building.</desc>
