name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless:
    name: headless tests (physics, sim, parity, strict VM)
    runs-on: ubuntu-latest
    env:
      AILANG_VERSION: v0.52.0
      GODOT_VERSION: 4.7.2-stable
      # M2.5 replay: the 10k-tick interpreter run takes ~75 s on this 2-core
      # runner (> 60 s, design risk row), so PRs replay the 2k-tick session and
      # main the 10k one; both are VM == interpreter == digest gated.
      REPLAY_TICKS: ${{ github.event_name == 'pull_request' && '2000' || '10000' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install AILANG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$AILANG_VERSION" --repo sunholo-data/ailang -p 'linux.x64.ailang.tar.gz' -D /tmp/ailang
          tar xzf /tmp/ailang/linux.x64.ailang.tar.gz -C /tmp/ailang
          sudo install /tmp/ailang/ailang /usr/local/bin/ailang
          ailang --version

      - name: Install Godot
        run: |
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          godot --headless --version

      - name: v0.51.0 x86_64 baseline outputs (throwaway branch only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.51.0 --repo sunholo-data/ailang -p 'linux.x64.ailang.tar.gz' -D /tmp/a51
          tar xzf /tmp/a51/linux.x64.ailang.tar.gz -C /tmp/a51
          git fetch -q origin main:refs/remotes/origin/main
          git worktree add -q /tmp/base origin/main
          cd /tmp/base && (cd sim && /tmp/a51/ailang lock) && git checkout -q sim/ailang.lock
          AILANG=/tmp/a51/ailang python3 tools/replay.py --ticks 10000 --scratch $GITHUB_WORKSPACE/out051 | tee $GITHUB_WORKSPACE/out051.txt || true
          AILANG=/tmp/a51/ailang python3 tools/replay.py --ticks 2000 --case session2k --scratch $GITHUB_WORKSPACE/out051 | tee -a $GITHUB_WORKSPACE/out051.txt || true
          rm -f $GITHUB_WORKSPACE/out051/*.interp.ndjson
      - uses: actions/upload-artifact@v4
        with:
          name: x86-goldens
          path: |
            out051/
            out051.txt
