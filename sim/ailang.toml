[effects]
max = ["IO", "FS"]

[stability]
level = "experimental"

[dependencies]
"sunholo/worlds" = "0.2.0" # R3-REASONS RT3b: propagate (the prediction at arrival); 0.1.0 modules unchanged byte for byte
"sunholo/celestial" = "0.6.0" # W1.1: published habitability; prior stellar API/results retained
"sunholo/relativity" = "0.12.0"
"sunholo/observe" = "0.1.0" # R3-EARTH-LINK EL1: lightcone (light cone, catch-up, link windows, beam rays, the Earth rate)
"sunholo/crew_core" = "0.6.0" # 0.6.0: stand-downs (R2-CREW-CONSOLE-V2 V8); 0.5.0: resource units as data (units.ail; the game keeps its table here): ailang-packages #146
"sunholo/social_dynamics" = "0.4.0" # crew_core's engine; sim/protocol_crew.ail reads its State for the crew view
