  "stapledons/sim/tools/exoplanets",
  "stapledons/sim/tools/exoplanets_test",
  "stapledons/sim/tools/exoplanets_verify",
  "stapledons/sim/data/exoplanets",
  "stapledons/sim/data/similar", "stapledons/sim/similar", "stapledons/sim/similar_test",
  "stapledons/sim/alpha_centauri",
  "stapledons/sim/destination_stars", "stapledons/sim/trappist1", "stapledons/sim/solar_departure", "stapledons/sim/core", "stapledons/sim/protocol", "stapledons/sim/ship", "stapledons/sim/tripphase", "stapledons/sim/rng", "stapledons/sim/markers", "stapledons/sim/ai", "stapledons/sim/consequence", "stapledons/sim/celestial", "stapledons/sim/navigation", "stapledons/sim/stops", "stapledons/sim/inferred_stars", "stapledons/sim/sync_orbit", "stapledons/sim/data/sol", "stapledons/sim/data/acen", "stapledons/sim/data/stars", "stapledons/sim/data/trappist1", "stapledons/sim/tools/catalogue_probe", "stapledons/sim/tools/catalogue", "stapledons/sim/tools/catalogue_bytes", "stapledons/sim/tools/sky_model", "stapledons/sim/tools/sky_model_test", "stapledons/sim/tools/catalogue_main", "stapledons/sim/tools/extract", "stapledons/sim/tools/extract_test", "stapledons/sim/tools/destar", "stapledons/sim/tools/destar_test", "stapledons/sim/tools/bright", "stapledons/sim/tools/bright_main", "stapledons/sim/tools/bright_test", "stapledons/sim/tools/starmap", "stapledons/sim/tools/starmap_test", "stapledons/sim/tools/companions", "stapledons/sim/tools/companions_test", "stapledons/sim/tools/lore", "stapledons/sim/tools/lore_test", "stapledons/sim/tools/lore_import", "stapledons/sim/tools/lore_check", "stapledons/sim/tools/lore_values", "stapledons/sim/tools/lore_values_test", "stapledons/sim/tools/lore_check_test", "stapledons/sim/tools/truth", "stapledons/sim/tools/truth_test", "stapledons/sim/tools/star_names", "stapledons/sim/tools/star_names_test", "stapledons/sim/tools/session_audit", "stapledons/sim/tools/session_audit_test", "stapledons/sim/tools/session_refusals", "stapledons/sim/tools/lens_lut", "stapledons/sim/tools/lens_lut_main", "stapledons/sim/gr", "stapledons/sim/gr_test", "stapledons/sim/ism", "stapledons/sim/data/ism", "stapledons/sim/tools/ism_build", "stapledons/sim/tools/ism_sensitivity", "stapledons/sim/tools/crew_pack", "stapledons/sim/tools/crew_pack_check", "st