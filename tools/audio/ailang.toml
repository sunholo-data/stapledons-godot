[package]
name = "stapledons/audio"
version = "0.1.0"
edition = "1"
description = "Stapledon's Voyage sound synthesis (R2-SOUND): recipes in, deterministic 48 kHz 16-bit WAVs and their manifest rows out. Authoring tool; not shipped."

[exports]
modules = ["stapledons/audio/synth_main", "stapledons/audio/synth_test", "stapledons/audio/review_main", "stapledons/audio/levels", "stapledons/audio/levels_main"]

[effects]
max = ["IO", "FS"]

[stability]
level = "experimental"

[dependencies]
"sunholo/audio" = "0.6.0" # R3-SUNHOLO-AUDIO-REALISM: closer-to-real synthesis (filter, pink/brown noise, FM, pluck, events in loops, reverb); every 0.5.0 sound byte-identical
